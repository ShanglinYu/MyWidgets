<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广州职工医保报销计算器 · 动态费用明细</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;margin:0;padding:24px 16px;color:#172033;line-height:1.6}
  .wrap{max-width:920px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.06);padding:28px 28px 32px}
  h1{font-size:21px;margin:0 0 4px;color:#0f172a}
  .sub{font-size:13px;color:#64748b;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #e2e8f0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px}}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:13px;font-weight:600;color:#334155}
  .field select,.field input{padding:9px 11px;font-size:14px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#1e293b;outline:none;width:100%;transition:border-color .15s}
  .field select:focus,.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .hint{font-size:11px;color:#94a3b8}
  .full{grid-column:1/-1}
  .cat-title{grid-column:1/-1;font-size:13px;font-weight:700;color:#0f172a;margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cat-title span{font-weight:400;font-size:11px;color:#94a3b8}

  /* 费用项列表 */
  .items-box{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin:4px 0}
  .item-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#f8fafc;border:1px solid #eef2f7;border-radius:9px}
  .item-row select,.item-row input{padding:8px 10px;font-size:13.5px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#1e293b;outline:none}
  .item-row select:focus,.item-row input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .item-type{flex:1.2 1 140px}
  .item-class{flex:0 0 78px}
  .item-amt{flex:1 1 110px}
  .item-extra{flex:2 1 170px;font-size:11.5px;color:#64748b;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .item-del{flex:0 0 32px;height:34px;border:none;background:#fee2e2;color:#dc2626;border-radius:7px;font-size:18px;cursor:pointer;line-height:1;font-weight:700}
  .item-del:hover{background:#fecaca}
  .basic-chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:#334155;font-weight:600;font-size:12px}
  .basic-chk input{width:14px;height:14px;accent-color:#2563eb}
  .add-row{grid-column:1/-1}
  .btn-add{padding:10px 16px;font-size:13.5px;font-weight:600;border:1px dashed #93c5fd;background:#eff6ff;color:#2563eb;border-radius:8px;cursor:pointer;width:100%}
  .btn-add:hover{background:#dbeafe}

  .btn-row{grid-column:1/-1;display:flex;gap:12px;margin-top:10px}
  .btn{flex:1;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:opacity .15s,transform .1s}
  .btn:active{transform:scale(.98)}
  .btn-main{background:#2563eb;color:#fff}
  .btn-main:hover{opacity:.9}
  .btn-reset{background:#f1f5f9;color:#475569;flex:0 0 100px}
  .btn-reset:hover{background:#e2e8f0}
  .err{grid-column:1/-1;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#b91c1c;font-size:13px;display:none}
  .err.show{display:block}
  .card{grid-column:1/-1;margin-top:18px;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;display:none}
  .card-head{background:#0f172a;color:#fff;padding:12px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .card-head span{font-weight:400;font-size:12px;color:#94a3b8}
  .card-head.biz{background:#1e3a8a}
  .line{display:flex;justify-content:space-between;padding:10px 16px;font-size:13.5px;border-bottom:1px solid #f1f5f9;gap:16px}
  .line:last-child{border-bottom:none}
  .line .k{color:#475569}
  .line .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .line.sub-line{padding-left:32px;font-size:12.5px;color:#64748b}
  .line.hl{background:#f0fdf4;font-size:15px}
  .line.hl .k,.line.hl .v{color:#166534;font-weight:700}
  .line.warn .v{color:#dc2626}
  .line.info .k{color:#0369a1}
  .line.info .v{color:#0369a1}
  .note{grid-column:1/-1;font-size:12px;color:#94a3b8;margin-top:12px;line-height:1.7;padding:10px 14px;background:#f8fafc;border-radius:8px}
  .biz-body{padding:14px 16px 4px}
  .biz-tip{font-size:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>广州职工医保报销计算器</h1>
  <div class="sub">动态费用明细 · 自动计算乙类先自付 · 2026年度广州职工医保待遇标准</div>

  <div class="grid">

    <div class="field">
      <label for="person">人员类别</label>
      <select id="person">
        <option value="active" selected>在职职工</option>
        <option value="retired">退休人员</option>
      </select>
    </div>

    <div class="field">
      <label for="visit">就医类型</label>
      <select id="visit">
        <option value="outpatient" selected>普通门诊</option>
        <option value="inpatient">住院</option>
        <option value="special1">一类门诊特定病种</option>
      </select>
    </div>

    <div class="field" id="levelField">
      <label for="level">医院/机构等级</label>
      <select id="level">
        <option value="primary" selected>一级医院 / 基层医疗机构</option>
        <option value="secondary">二级医院</option>
        <option value="tertiary">三级医院 / 专科及其他</option>
      </select>
      <span class="hint" id="levelHint">门诊默认基层</span>
    </div>

    <div class="cat-title full">
      费用明细
      <span>逐项添加：选类型、选甲/乙类、填金额；乙类先自付自动算</span>
    </div>
    <div class="items-box" id="items"></div>
    <div class="add-row">
      <button class="btn-add" id="addItem" type="button">＋ 添加费用项</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-main" id="calc">计 算</button>
      <button class="btn btn-reset" id="reset">重 置</button>
    </div>

    <div class="err" id="err"></div>

    <div class="card" id="card">
      <div class="card-head">计算结果 <span id="meta"></span></div>
      <div id="body"></div>
    </div>

    <!-- ===== 商业保险计算器 ===== -->
    <div class="card" id="bizCard">
      <div class="card-head biz">商业保险计算器 <span>社保先行赔付后 · 0免赔 · 80%赔付</span></div>
      <div class="biz-body">
        <div class="field">
          <label for="bizPaid">医保统筹实际支付金额</label>
          <input id="bizPaid" type="text" inputmode="decimal" placeholder="如：3000+1500.5（可用加号拼接多笔金额）">
          <span class="hint">默认已填入上方“理论统筹报销额”，若与实际医保结算单不一致，请直接修改；支持用「+」拼接多笔</span>
        </div>
        <div id="bizOut"></div>
        <div class="biz-tip">
          ⚠️ 本计算器假设所有费用均发生在<strong>同一天</strong>。若实际费用跨多天，请按天拆分后分别计算（日限额：检查费 800 元/天，非检查费 300 元/天）。
        </div>
      </div>
    </div>

    <div class="note" id="note"></div>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const itemsBox = $('items');

const OUT_RATE = {
  active:  { primary: 0.80, primaryBasic: 0.88, tertiary: 0.65 },
  retired: { primary: 0.85, primaryBasic: 0.935, tertiary: 0.70 }
};
const IN_RATE = {
  active:  { primary: 0.90, secondary: 0.85, tertiary: 0.80 },
  retired: { primary: 0.93, secondary: 0.895, tertiary: 0.86 }
};
const DEDUCT = { primary: 250, secondary: 500, tertiary: 1000 };
const SPECIAL1 = { primary: 0.85, primaryBasic: 0.935, other: 0.70 };
const OUT_CAP = { active: 8222, retired: 11511 };

/* 商业保险参数 */
const BIZ_RATE = 0.80;          // 0 免赔，80% 赔付
const BIZ_CAP_EXAM = 800;       // 检查费日赔付上限
const BIZ_CAP_OTHER = 300;      // 非检查费日赔付上限

const TYPE_NAME = { drug:'药品', exam:'检查', treat:'治疗', mat1:'一次性医用材料', organ:'人造器官·体内置放材料' };
const TYPE_OPTIONS = [
  { v:'drug',  t:'药品' },
  { v:'exam',  t:'检查' },
  { v:'treat', t:'治疗' },
  { v:'mat1',  t:'一次性医用材料' },
  { v:'organ', t:'人造器官·体内置放材料' }
];

const person = $('person'), visit = $('visit'), level = $('level');
const err = $('err'), card = $('card'), body = $('body'), meta = $('meta'), note = $('note');
const bizCard = $('bizCard'), bizPaid = $('bizPaid'), bizOut = $('bizOut');

const fmt = n => n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

/* ============================================================
   费用行：创建 / 更新附加选项 / 删除
   ============================================================ */
function createRow(data){
  data = data || { type:'drug', cls:'jia', amt:0, basic:false };

  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.basic = data.basic ? '1' : '0';

  const typeSel = document.createElement('select');
  typeSel.className = 'item-type';
  typeSel.title = '费用类型';
  TYPE_OPTIONS.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.v; opt.textContent = o.t;
    if(o.v === data.type) opt.selected = true;
    typeSel.appendChild(opt);
  });

  const clsSel = document.createElement('select');
  clsSel.className = 'item-class';
  clsSel.title = '甲类 / 乙类';
  [['jia','甲类'],['yi','乙类']].forEach(([v,t])=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = t;
    if(v === data.cls) opt.selected = true;
    clsSel.appendChild(opt);
  });

  const amt = document.createElement('input');
  amt.type = 'number';
  amt.className = 'item-amt';
  amt.min = '0'; amt.step = '0.01';
  amt.value = data.amt;
  amt.placeholder = '金额（元）';

  const extra = document.createElement('div');
  extra.className = 'item-extra';

  const del = document.createElement('button');
  del.className = 'item-del';
  del.type = 'button';
  del.textContent = '×';
  del.title = '删除此费用项';
  del.addEventListener('click', ()=>{
    row.remove();
    if(itemsBox.children.length === 0) createRow();
  });

  typeSel.addEventListener('change', ()=>updateRowExtra(row));
  clsSel.addEventListener('change', ()=>updateRowExtra(row));

  row.appendChild(typeSel);
  row.appendChild(clsSel);
  row.appendChild(amt);
  row.appendChild(extra);
  row.appendChild(del);

  itemsBox.appendChild(row);
  updateRowExtra(row);
  return row;
}

function updateRowExtra(row){
  const vt = visit.value, lv = level.value, p = person.value;
  const sceneBasic = (vt === 'outpatient' || vt === 'special1') && lv === 'primary';
  const type = row.querySelector('.item-type').value;
  const cls = row.querySelector('.item-class').value;
  const extra = row.querySelector('.item-extra');

  // 药品且在基层门诊/门特：显示基药勾选（影响先自付和报销比例）
  if(type === 'drug' && sceneBasic){
    const checked = row.dataset.basic === '1';
    const basicRate = vt === 'outpatient'
      ? (p === 'active' ? '88%' : '93.5%')
      : '93.5%';
    const label = cls === 'yi'
      ? `国家基本药物（先自付0%，报销${basicRate}）`
      : `国家基本药物（报销${basicRate}）`;
    extra.innerHTML = `<label class="basic-chk"><input type="checkbox" class="item-basic" ${checked?'checked':''}> ${label}</label>`;
    extra.querySelector('.item-basic').addEventListener('change', e=>{
      row.dataset.basic = e.target.checked ? '1' : '0';
    });
    return;
  }

  // 非基药场景：重置基药标记，显示比例说明
  row.dataset.basic = '0';
  let txt = '';
  if(cls === 'jia'){
    txt = '甲类 · 无先自付';
  } else {
    switch(type){
      case 'drug':  txt = '乙类药品 · 先自付5%'; break;
      case 'exam':  txt = '乙类检查 · 先自付15%'; break;
      case 'treat': txt = '乙类治疗 · 先自付10%'; break;
      case 'mat1':  txt = '乙类一次性材料 · 先自付10%'; break;
      case 'organ': txt = '乙类人造器官材料 · 先自付20%'; break;
    }
  }
  extra.innerHTML = `<span>${txt}</span>`;
}

/* ============================================================
   表单联动
   ============================================================ */
function syncUI(){
  const vt = visit.value;

  // 二级医院仅住院时出现
  level.options[1].style.display = vt === 'inpatient' ? '' : 'none';
  if(vt !== 'inpatient' && level.value === 'secondary') level.value = 'primary';

  if(vt === 'outpatient'){
    level.options[0].textContent = '一级医院 / 基层医疗机构';
    level.options[2].textContent = '三级医院 / 专科及其他';
    $('levelHint').textContent = '门诊默认基层；基层在职80%/退休85%，其他在职65%/退休70%';
  } else if(vt === 'inpatient'){
    level.options[0].textContent = '一级医院';
    level.options[2].textContent = '三级医院';
    $('levelHint').textContent = '住院起付：250 / 500 / 1,000 元';
  } else {
    level.options[0].textContent = '基层医疗机构';
    level.options[2].textContent = '其他医疗机构 / 指定专科';
    $('levelHint').textContent = '一类门特基层85%，其他70%';
  }

  // 更新所有行的附加选项
  itemsBox.querySelectorAll('.item-row').forEach(updateRowExtra);

  // 说明文字
  if(vt === 'outpatient'){
    note.innerHTML = '<strong>普通门诊：</strong>无起付线。基层在职80%/退休85%，使用国家基本药物时在职88%/退休93.5%；专科及其他在职65%/退休70%。乙类费用先按类别自付，剩余部分按比例报销。年度限额在职8,222元/退休11,511元，本计算器不累计历史额度。';
  } else if(vt === 'inpatient'){
    note.innerHTML = '<strong>住院：</strong>起付线一级250元/二级500元/三级1,000元，起付线以下全自费。起付线以上、扣除乙类先自付后的基数，在职报销90%/85%/80%，退休93%/89.5%/86%。大额补助需住院自付年度累计超2,000元，本计算器仅提示不自动累计。';
  } else {
    note.innerHTML = '<strong>一类门特：</strong>无起付线。基层85%（使用国家基本药物93.5%），其他70%。乙类费用先按类别自付，剩余基数按比例报销。部分病种有季度限额（如高血压、糖尿病600元/季度），本计算器未做限额校验。';
  }
}

[visit, level, person].forEach(el => el.addEventListener('change', syncUI));

/* ============================================================
   计算（医保）
   ============================================================ */
let lastCalc = null;

function calc(){
  err.classList.remove('show');
  card.style.display = 'none';
  bizCard.style.display = 'none';
  lastCalc = null;

  const p = person.value, vt = visit.value, lv = level.value;
  const sceneBasic = (vt === 'outpatient' || vt === 'special1') && lv === 'primary';

  const rows = itemsBox.querySelectorAll('.item-row');
  const items = [];
  let total = 0, selfPayTotal = 0;

  for(const row of rows){
    const type = row.querySelector('.item-type').value;
    const cls = row.querySelector('.item-class').value;
    const amtRaw = row.querySelector('.item-amt').value;
    const amt = parseFloat(amtRaw);
    if(amtRaw !== '' && (isNaN(amt) || amt < 0)){
      showErr('金额必须是非负数。');
      return;
    }
    if(!amt || amt <= 0) continue;

    const basic = row.dataset.basic === '1';
    let rate = 0;
    if(cls === 'yi'){
      switch(type){
        case 'drug':  rate = (basic && sceneBasic) ? 0 : 0.05; break;
        case 'exam':  rate = 0.15; break;
        case 'treat': rate = 0.10; break;
        case 'mat1':  rate = 0.10; break;
        case 'organ': rate = 0.20; break;
      }
    }
    const sp = amt * rate;
    items.push({ type, cls, amt, rate, selfPay: sp, basic, reimbRate: 0, reimburse: 0 });
    total += amt;
    selfPayTotal += sp;
  }

  if(total <= 0){
    showErr('请至少输入一项大于 0 的费用金额。');
    return;
  }

  // 报销参数
  let deductible = 0, baseRate = 0, rateLabel = '';
  if(vt === 'outpatient'){
    if(lv === 'primary'){
      baseRate = OUT_RATE[p].primary;
      rateLabel = '基层医疗机构';
    } else {
      baseRate = OUT_RATE[p].tertiary;
      rateLabel = '专科/其他医疗机构';
    }
  } else if(vt === 'inpatient'){
    deductible = DEDUCT[lv];
    baseRate = IN_RATE[p][lv];
    rateLabel = { primary:'一级医院', secondary:'二级医院', tertiary:'三级医院' }[lv];
  } else {
    if(lv === 'primary'){
      baseRate = SPECIAL1.primary;
      rateLabel = '基层医疗机构';
    } else {
      baseRate = SPECIAL1.other;
      rateLabel = '其他/专科医疗机构';
    }
  }

  let reimburse = 0;
  let deductiblePart = 0, reimbBase = 0;
  let hasBasic = false;

  if(vt === 'inpatient'){
    // 住院：起付线 + 统一比例
    deductiblePart = Math.min(deductible, total);
    const above = total - deductiblePart;
    reimbBase = Math.max(0, above - selfPayTotal);
    reimburse = reimbBase * baseRate;
  } else {
    // 门诊/门特：逐项计算，基药行用更高比例
    for(const it of items){
      const base = it.amt - it.selfPay;
      let r = baseRate;
      if(it.type === 'drug' && it.basic && sceneBasic){
        r = vt === 'outpatient' ? OUT_RATE[p].primaryBasic : SPECIAL1.primaryBasic;
        hasBasic = true;
      }
      it.reimbRate = r;
      it.reimburse = base * r;
      reimburse += it.reimburse;
    }
  }

  const personal = total - reimburse;

  /* ---------- 渲染 ---------- */
  const vtName = { outpatient:'普通门诊', inpatient:'住院', special1:'一类门特' }[vt];
  let metaText = `${p === 'active' ? '在职职工' : '退休人员'} · ${vtName} · ${rateLabel} ${(baseRate*100).toFixed(1)}%`;
  if(hasBasic){
    metaText += '（含基药零差率）';
  }
  meta.textContent = metaText;

  let h = '';
  h += line('医疗总费用', fmt(total) + ' 元');

  // 逐项明细
  items.forEach(it=>{
    const clsName = it.cls === 'jia' ? '甲类' : '乙类';
    const basicTag = (it.type === 'drug' && it.basic && sceneBasic) ? '· 基药' : '';
    h += line(`  ${TYPE_NAME[it.type]}（${clsName}${basicTag}）`, fmt(it.amt) + ' 元', 'sub-line');
    if(it.selfPay > 0){
      h += line(`    乙类先自付（${(it.rate*100).toFixed(1)}%）`, '- ' + fmt(it.selfPay) + ' 元', 'sub-line warn');
    }
  });

  if(deductiblePart > 0){
    h += line('住院起付线（个人全额负担）', '- ' + fmt(deductiblePart) + ' 元', 'warn');
  }
  if(selfPayTotal > 0){
    h += line('乙类先自付合计', '- ' + fmt(selfPayTotal) + ' 元', 'warn');
  }
  if(vt === 'inpatient'){
    h += line('纳入报销的基数', fmt(reimbBase) + ' 元');
  }

  // 门诊逐项报销：如果存在基药行，展示分组
  if(vt !== 'inpatient' && hasBasic){
    let basicReimb = 0, otherReimb = 0;
    items.forEach(it=>{
      if(it.type === 'drug' && it.basic && sceneBasic) basicReimb += it.reimburse;
      else otherReimb += it.reimburse;
    });
    if(basicReimb > 0){
      const br = vt === 'outpatient' ? OUT_RATE[p].primaryBasic : SPECIAL1.primaryBasic;
      h += line(`基药零差率部分报销（${(br*100).toFixed(1)}%）`, '+ ' + fmt(basicReimb) + ' 元', 'sub-line');
    }
    if(otherReimb > 0){
      h += line(`其他费用报销（${(baseRate*100).toFixed(1)}%）`, '+ ' + fmt(otherReimb) + ' 元', 'sub-line');
    }
  }

  h += line('统筹基金报销合计', '+ ' + fmt(reimburse) + ' 元', 'hl');
  h += line('个人总负担（自费 + 自付）', fmt(personal) + ' 元', 'warn');

  if(vt === 'outpatient'){
    const cap = OUT_CAP[p];
    h += line('ℹ️ 门诊年度限额', reimburse > cap
      ? `本次报销额超过限额 ${fmt(cap)} 元，实际以限额为准`
      : `在职 8,222 元 / 退休 11,511 元（本次未超限）`, 'info');
  }
  if(vt === 'inpatient' && personal > 2000){
    h += line('ℹ️ 大额补助提示', '个人自付超 2,000 元部分，年度累计后可再报 70%', 'info');
  }

  body.innerHTML = h;
  card.style.display = 'block';

  /* ---------- 商业保险：准备数据 ---------- */
  // A = 社保承认的计算基数（按项扣除乙类先自付，住院再按比例分摊起付线）
  let examBaseRaw = 0, otherBaseRaw = 0;
  for(const it of items){
    const b = it.amt - it.selfPay;
    if(it.type === 'exam') examBaseRaw += b;
    else otherBaseRaw += b;
  }
  const rawTotal = examBaseRaw + otherBaseRaw;

  let A_exam = examBaseRaw, A_other = otherBaseRaw;
  if(vt === 'inpatient' && deductiblePart > 0 && rawTotal > 0){
    A_exam  = Math.max(0, examBaseRaw  - deductiblePart * examBaseRaw  / rawTotal);
    A_other = Math.max(0, otherBaseRaw - deductiblePart * otherBaseRaw / rawTotal);
  }

  lastCalc = {
    total,
    A_exam,
    A_other,
    A_total: A_exam + A_other
  };

  // 默认填入理论统筹报销额，用户可自行修改 / 用 + 拼接
  bizPaid.value = reimburse.toFixed(2);
  renderBiz();
  bizCard.style.display = 'block';

  card.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function line(k, v, cls=''){
  return `<div class="line ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}

function showErr(msg){
  err.textContent = msg;
  err.classList.add('show');
  card.style.display = 'none';
  bizCard.style.display = 'none';
}

/* ============================================================
   商业保险计算
   ============================================================ */
function parseAmounts(str){
  const raw = (str || '').replace(/＋/g, '+').trim();
  if(raw === '') return { ok:true, sum:0, count:0 };
  const parts = raw.split('+').map(s=>s.trim()).filter(s=>s !== '');
  if(parts.length === 0) return { ok:true, sum:0, count:0 };
  let sum = 0;
  for(const p of parts){
    if(!/^\d*\.?\d*$/.test(p) || p === '.' || p === '') return { ok:false, sum:0, count:0 };
    const n = Number(p);
    if(isNaN(n) || n < 0) return { ok:false, sum:0, count:0 };
    sum += n;
  }
  return { ok:true, sum, count: parts.length };
}

function renderBiz(){
  if(!lastCalc) return;

  const parsed = parseAmounts(bizPaid.value);
  if(!parsed.ok){
    bizOut.innerHTML = `<div class="err show" style="margin:8px 0">金额格式有误：请填写非负数字，可用「+」连接多笔，例如 3000+1500.5</div>`;
    return;
  }

  const A = lastCalc.A_total;
  const Aex = lastCalc.A_exam;
  const Aot = lastCalc.A_other;
  const B = parsed.sum;

  // 把医保实付按“社保承认基数”比例分摊到检查费 / 其他费用
  let Bex = 0, Bot = 0;
  if(A > 0){
    Bex = Math.min(B * Aex / A, Aex);
    Bot = Math.min(B * Aot / A, Aot);
  }

  const Rex = Math.max(0, Aex - Bex);
  const Rot = Math.max(0, Aot - Bot);

  const rawPayEx = Rex * BIZ_RATE;
  const rawPayOt = Rot * BIZ_RATE;

  const payEx = Math.min(rawPayEx, BIZ_CAP_EXAM);
  const payOt = Math.min(rawPayOt, BIZ_CAP_OTHER);
  const bizPay = payEx + payOt;

  const remainTotal = Math.max(0, A - B);
  const finalSelf = lastCalc.total - B - bizPay;

  let h = '';
  h += line('社保承认基数合计（A）', fmt(A) + ' 元');
  h += line('　├ 检查费基数', fmt(Aex) + ' 元', 'sub-line');
  h += line('　└ 其他费用基数', fmt(Aot) + ' 元', 'sub-line');
  h += line(`医保统筹实际支付（B）${parsed.count > 1 ? '（已合并 ' + parsed.count + ' 笔）' : ''}`, '- ' + fmt(B) + ' 元', 'warn');
  h += line('剩余合理部分（A - B）', fmt(remainTotal) + ' 元');
  h += line('　├ 检查费剩余', fmt(Rex) + ' 元', 'sub-line');
  h += line('　└ 其他费用剩余', fmt(Rot) + ' 元', 'sub-line');

  h += line('【检查费】' + fmt(Rex) + ' × 80% = ' + fmt(rawPayEx) + ' 元，日限额 ' + BIZ_CAP_EXAM + ' 元',
            fmt(payEx) + ' 元', rawPayEx > BIZ_CAP_EXAM ? 'warn' : '');
  h += line('【其他费用】' + fmt(Rot) + ' × 80% = ' + fmt(rawPayOt) + ' 元，日限额 ' + BIZ_CAP_OTHER + ' 元',
            fmt(payOt) + ' 元', rawPayOt > BIZ_CAP_OTHER ? 'warn' : '');

  h += line('商业保险赔付合计', '+ ' + fmt(bizPay) + ' 元', 'hl');
  h += line('个人最终负担（总费用 - 医保实付 - 商保赔付）', fmt(finalSelf) + ' 元', 'warn');

  if(rawPayEx > BIZ_CAP_EXAM || rawPayOt > BIZ_CAP_OTHER){
    h += line('ℹ️ 限额提示', '超出日限额部分商保不予赔付（按同日单次计算）', 'info');
  }

  bizOut.innerHTML = h;
}

bizPaid.addEventListener('input', renderBiz);
bizPaid.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); renderBiz(); }
});

/* ============================================================
   初始化 / 重置 / 事件
   ============================================================ */
function initItems(){
  itemsBox.innerHTML = '';
  createRow({ type:'drug',  cls:'jia', amt:0 });
  createRow({ type:'exam',  cls:'jia', amt:0 });
  createRow({ type:'treat', cls:'jia', amt:0 });
}

$('addItem').addEventListener('click', ()=>{
  const row = createRow({ type:'drug', cls:'jia', amt:0 });
  row.querySelector('.item-amt').focus();
});

$('calc').addEventListener('click', calc);

$('reset').addEventListener('click', ()=>{
  person.value = 'active';
  visit.value = 'outpatient';
  level.value = 'primary';
  initItems();
  syncUI();
  card.style.display = 'none';
  bizCard.style.display = 'none';
  bizPaid.value = '';
  bizOut.innerHTML = '';
  lastCalc = null;
  err.classList.remove('show');
});

document.querySelectorAll('input,select').forEach(el=>{
  if(el === bizPaid) return;
  el.addEventListener('keydown', e=>{ if(e.key === 'Enter') calc(); });
});

// 启动
initItems();
syncUI();
</script>
